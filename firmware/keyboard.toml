# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5"]
col_pins = ["PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_16", "PIN_17", "PIN_18", "PIN_19", "PIN_20", "PIN_21", "PIN_22"]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 6
cols = 17
layers = 1

keymap = [
    [
        [
            "Esc", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8",
            "F9", "F10", "F11", "F12", "PrintScreen", "F13", "F14", "F15"
        ],
        [
            "`", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8",
            "Kc9", "Kc0", "-", "=", "Backspace", "Fn", "Home", "PgUp"
        ],
        [
            "Tab", "Q", "W", "E", "R", "T", "Y", "U", "I",
            "O", "P", "[", "]", "\\", "Delete", "End", "PgDn"
        ],
        [
            "CapsLock", "A", "S", "D", "F", "G", "H", "J", "K",
            "L", ";", "'", "Enter",
            "_", "_", "_", "_"
        ],
        [
            "LShift", "Z", "X", "C", "V", "B", "N", "M", ",",
            ".", "/", "RShift", "Up",
            "_", "_", "_", "_"
        ],
        [
            "LCtrl", "LAlt", "LGui", "Space", "RGui", "RAlt",
            "RCtrl", "_", "_", "_",
            "_", "_", "_", "_", "Left", "Down", "Right"
        ]
    ]
]
